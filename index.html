<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lycka till | スタッフメニュー</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f5f5f1;
      color: #24343b;
      font: 16px/1.6 system-ui, sans-serif;
    }
    main {
      width: min(100%, 460px);
      padding: clamp(22px, 6vw, 36px);
      background: #fff;
      border: 1px solid #dbe0dd;
      border-radius: 16px;
    }
    h1 { margin: 0 0 22px; color: #243941; font: 34px Georgia, serif; }
    nav { display: grid; gap: 12px; }
    a {
      display: grid;
      gap: 2px;
      padding: 13px 16px;
      border: 1px solid #36545e;
      border-radius: 9px;
      background: #36545e;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
    a:hover { background: #243941; }
    a:focus-visible { outline: 3px solid #527a91; outline-offset: 3px; }
    a span { font-size: 14px; font-weight: 400; }
  </style>
</head>

  <main>
    <h1>Lycka till</h1>
    <nav aria-label="スタッフメニュー">

      <a target="_top" href="https://script.google.com/macros/s/AKfycbwsRP4Jqx7KrB3PY9EmoJ7qhM2EQVzScJBCjkCcvG2-prVeozflaF6wdOVGUH_WUEcn/exec?view=blog">
